<style>
:root{
  --olive:#3E4A32; --olive-dk:#2C3423; --cream:#F4F0E6; --paper:#FBF9F3;
  --rust:#A13D2C; --sand:#C9BFA0; --gold:#B99A4F; --line:#E4DFD1; --ink:#2B2B26;
  --blue:#3E6B8A; --purple:#7A5C8A;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--olive-dk);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  color:var(--ink);
  overscroll-behavior-y:none;
}
#app{
  max-width:480px; margin:0 auto; min-height:100vh; background:var(--cream);
  position:relative;
  box-shadow:0 0 40px rgba(0,0,0,0.3);
}
.stickyhead{ position:sticky; top:0; z-index:25; }
.installbanner{
  background:var(--gold); color:var(--olive-dk); padding:10px 14px; font-size:11.5px; line-height:1.5;
  display:flex; align-items:center; gap:10px; position:relative;
}
.installbanner .txt{ flex:1; }
.installbanner .installbtn{
  flex:0 0 auto; background:var(--olive-dk); color:#fff; border:none; border-radius:8px; padding:7px 12px; font-size:11.5px; font-weight:700;
}
.installbanner .closebtn{ flex:0 0 auto; background:none; border:none; color:var(--olive-dk); font-size:16px; padding:0 2px; opacity:0.7; }

/* ---- top bar ---- */
.topbar{
  position:sticky; top:0; z-index:20; background:var(--olive); color:#fff;
  padding:calc(10px + var(--safe-top)) 16px 10px 16px;
}
.topbar h1{ font-size:16px; margin:0; font-weight:700; letter-spacing:0.5px; }
.topbar .sub{ font-size:10.5px; opacity:0.75; margin-top:2px; }

/* ---- day chips ---- */
.daychips{
  display:flex; gap:6px; overflow-x:auto; padding:10px 12px; background:var(--olive);
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.daychips::-webkit-scrollbar{display:none;}
.daychip{
  flex:0 0 auto; padding:6px 12px; border-radius:20px; background:rgba(255,255,255,0.12);
  color:#fff; font-size:12px; font-weight:600; white-space:nowrap; border:1px solid rgba(255,255,255,0.15);
}
.daychip.active{ background:var(--gold); color:var(--olive-dk); }

/* ---- content ---- */
.content{ padding:14px 14px calc(80px + var(--safe-bottom)) 14px; }
.hide{ display:none !important; }

/* weather */
.weathercard{
  display:flex; align-items:center; justify-content:space-between; background:linear-gradient(135deg,var(--olive),var(--olive-dk));
  color:#fff; border-radius:14px; padding:14px 16px; margin-bottom:12px;
}
.weathercard .wleft{ display:flex; align-items:center; gap:10px; }
.weathercard .wicon{ font-size:30px; }
.weathercard .wtext .wplace{ font-size:12px; opacity:0.85; }
.weathercard .wtext .wtemp{ font-size:18px; font-weight:700; margin-top:1px; }
.weathercard .wnote{ font-size:10px; opacity:0.7; max-width:120px; text-align:right; line-height:1.4; }

/* day header */
.daytitle{ font-size:19px; font-weight:800; color:var(--olive-dk); margin:2px 0 6px 0; line-height:1.35; }
.dayquote{ font-size:11.5px; color:var(--rust); font-style:italic; margin-bottom:8px; }
.daymeta{ font-size:11px; color:#6b7160; margin-bottom:10px; }
.warnbar{ background:#F4E3DD; border-left:4px solid var(--rust); color:#7A2E1E; font-size:12px; padding:8px 12px; border-radius:6px; margin-bottom:10px; }

/* info chips (flight/hotel/car) */
.infochip{
  display:flex; gap:10px; align-items:flex-start; background:var(--paper); border:1px solid var(--line);
  border-radius:12px; padding:10px 12px; margin-bottom:8px;
}
.infochip .icon{ font-size:18px; }
.infochip .body{ flex:1; }
.infochip .t1{ font-size:12.5px; font-weight:700; color:var(--olive-dk); }
.infochip .t2{ font-size:11px; color:#6b6b60; margin-top:2px; line-height:1.5; }
.infochip.flight{ border-left:3px solid var(--blue); }
.infochip.hotel{ border-left:3px solid var(--olive); }
.infochip.car{ border-left:3px solid var(--sand); }

/* section title */
.sectitle{ font-size:12px; font-weight:800; color:var(--rust); letter-spacing:1.5px; margin:16px 0 8px 2px; text-transform:uppercase; }
.itinerary-list{ margin:0 0 6px 0; padding-left:18px; font-size:12.5px; line-height:1.9; color:var(--ink); }

/* item card */
.card{
  background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px 13px; margin-bottom:10px;
}
.card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.card-name{ font-size:13.5px; font-weight:700; color:var(--olive-dk); line-height:1.4; }
.stepdot{ display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px; border-radius:50%; background:var(--olive); color:#fff; font-size:10.5px; font-weight:800; margin-right:7px; vertical-align:-4px; }
.typetag{
  flex:0 0 auto; font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:20px; color:#fff; white-space:nowrap;
}
.typetag.attraction{ background:var(--olive); }
.typetag.food{ background:var(--rust); }
.typetag.shop{ background:var(--gold); color:var(--olive-dk); }
.card-meta{ font-size:10.8px; color:#7a7a6d; margin-top:4px; line-height:1.6; }
.tagrow{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.tag{ font-size:9.8px; font-weight:700; padding:3px 8px; border-radius:20px; }
.tag.mustEat{ background:#FBE3DC; color:#8C2F1E; }
.tag.mustBuy{ background:#F4E9CE; color:#7A5C10; }
.tag.top{ background:#E9E1F0; color:var(--purple); }
.tag.book{ background:#DCE7EE; color:var(--blue); font-family:ui-monospace,monospace; }
.tip-box{ margin-top:8px; background:#EFE9DA; border-radius:8px; padding:8px 10px; font-size:11px; color:#4a4a3c; line-height:1.6; }
.tip-box b{ color:var(--olive-dk); }
.navrow{ display:flex; gap:8px; margin-top:9px; }
.navbtn{
  flex:1; text-align:center; font-size:11.5px; font-weight:700; padding:8px 0; border-radius:9px;
  text-decoration:none; display:flex; align-items:center; justify-content:center; gap:5px;
}
.navbtn.google{ background:#4285F4; color:#fff; }
.navbtn.apple{ background:#1c1c1e; color:#fff; }
.linkrow{ display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.chip{ font-size:9.5px; color:var(--olive-dk); text-decoration:none; background:#EDE7D6; border:1px solid var(--line); border-radius:20px; padding:3px 8px; }
.chip-ig{ color:#fff; border:none; background:linear-gradient(45deg,#F09433,#E6683C,#DC2743,#CC2366,#BC1888); font-weight:700; }
.chip-yt{ color:#fff; border:none; background:#FF0000; font-weight:700; }
.chip-threads{ color:#fff; border:none; background:#000; font-weight:700; }
.chip-tabelog{ color:#1c1c1c; border:none; background:#FFC72C; font-weight:700; }

/* freeday */
.freeday{ text-align:center; padding:30px 0; color:var(--olive); font-size:13px; font-style:italic; }

/* appendix collapsible */
.accordion{ background:var(--paper); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; overflow:hidden; }
.accordion summary{ padding:12px 14px; font-size:13px; font-weight:700; color:var(--olive-dk); cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; }
.accordion summary::-webkit-details-marker{ display:none; }
.accordion summary::after{ content:"›"; transform:rotate(90deg); transition:transform 0.2s; font-size:18px; }
.accordion[open] summary::after{ transform:rotate(-90deg); }
.accordion .inner{ padding:0 14px 12px 14px; }
.mini-group-title{ font-size:11px; font-weight:700; color:var(--rust); margin:10px 0 6px 0; }

/* pocket list sub-tabs */
.subchiprow{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px 0; margin-bottom:8px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.subchiprow::-webkit-scrollbar{ display:none; }
.subchip{ flex:0 0 auto; padding:7px 14px; border-radius:20px; background:var(--paper); border:1px solid var(--line); color:var(--olive-dk); font-size:12px; font-weight:700; white-space:nowrap; }
.subchip.active{ background:var(--olive); color:#fff; border-color:var(--olive); }

/* ---- info tab ---- */
.infopage h2{ font-size:15px; color:var(--olive-dk); margin:18px 0 8px 0; }
.infopage h2:first-child{ margin-top:2px; }
.bigcard{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
.bigcard .name{ font-size:13.5px; font-weight:700; color:var(--olive-dk); }
.bigcard .detail{ font-size:11.5px; color:#6b6b60; margin-top:4px; line-height:1.7; }
.callbtn{ display:inline-flex; align-items:center; gap:6px; margin-top:8px; background:var(--olive); color:#fff; font-size:11.5px; font-weight:700; padding:7px 12px; border-radius:9px; text-decoration:none; }
.emergency-card{ border-left:4px solid var(--rust); }
.checkrow{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
.checkrow:last-child{ border-bottom:none; }
.checkrow input[type=checkbox]{ width:18px; height:18px; accent-color:var(--olive); flex:0 0 auto; }
.checkrow .checked-text{ text-decoration:line-through; color:#a8a294; }

/* ---- budget tab ---- */
.budget-summary{ background:linear-gradient(135deg,var(--olive),var(--olive-dk)); color:#fff; border-radius:16px; padding:18px; text-align:center; margin-bottom:14px; }
.budget-summary .amt{ font-size:30px; font-weight:800; margin-top:2px; }
.budget-summary .lbl{ font-size:11px; opacity:0.8; }
.budget-form{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
.budget-form .row{ display:flex; gap:8px; margin-bottom:8px; }
.budget-form select, .budget-form input{
  flex:1; min-width:0; width:100%; max-width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:13px; background:#fff; font-family:inherit;
  -webkit-appearance:none; appearance:none;
}
.budget-form button{
  width:100%; background:var(--olive); color:#fff; border:none; border-radius:9px; padding:11px 0; font-size:13.5px; font-weight:700;
}
.expense-item{ display:flex; justify-content:space-between; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:7px; }
.expense-item .left .cat{ font-size:12px; font-weight:700; color:var(--olive-dk); }
.expense-item .left .note{ font-size:10.5px; color:#8a8a7c; margin-top:1px; }
.expense-item .right{ display:flex; align-items:center; gap:8px; }
.expense-item .amt{ font-size:13px; font-weight:700; color:var(--rust); }
.delbtn{ background:none; border:none; color:#b0a99a; font-size:16px; padding:2px 4px; }
.empty-note{ text-align:center; color:#9a9482; font-size:12px; padding:20px 0; }

/* toggle switch */
.switch{ position:relative; display:inline-block; width:44px; height:24px; flex:0 0 auto; }
.switch input{ opacity:0; width:0; height:0; position:absolute; }
.switch .slider{ position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background-color:#d8d3c2; transition:.2s; border-radius:24px; }
.switch .slider:before{ position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background-color:#fff; transition:.2s; border-radius:50%; }
.switch input:checked + .slider{ background-color:var(--olive); }
.switch input:checked + .slider:before{ transform:translateX(20px); }

/* ---- bottom nav ---- */
.bottomnav{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
  display:flex; background:#fff; border-top:1px solid var(--line);
  padding-bottom:var(--safe-bottom); z-index:30;
}
.navitem{ flex:1; text-align:center; padding:10px 0 8px 0; font-size:10.5px; color:#9a9482; }
.navitem .ic{ font-size:20px; display:block; margin-bottom:2px; }
.navitem.active{ color:var(--olive); font-weight:700; }
</style>
</head>

/* ================= HELPERS ================= */
function esc(s){ return s || ""; }
function flightTrackLink(code){
  if(!code) return null;
  const m = code.match(/^UO0*(\d+)$/i);
  if(m) return `https://www.flightaware.com/live/flight/HKE${m[1]}`;
  return `https://www.flightaware.com/live/flight/${code}`;
}
function mapLinksFor(name, existingGmap){
  const q = encodeURIComponent(name.replace(/[（(].*?[)）]/g,"").trim() + " Japan");
  return {
    google: existingGmap || `https://www.google.com/maps/search/?api=1&query=${q}`,
    apple: `https://maps.apple.com/?q=${q}`,
  };
}
function weatherEmoji(code){
  if(code===0) return "☀️";
  if([1,2].includes(code)) return "🌤️";
  if(code===3) return "☁️";
  if([45,48].includes(code)) return "🌫️";
  if([51,53,55,61,63,65,80,81,82].includes(code)) return "🌧️";
  if([71,73,75,85,86].includes(code)) return "🌨️";
  if([95,96,99].includes(code)) return "⛈️";
  return "🌥️";
}
async function fetchWeather(base, dateStr){
  const c = BASE_COORDS[base];
  if(!c) return null;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FTokyo&start_date=${dateStr}&end_date=${dateStr}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data && data.daily && data.daily.time && data.daily.time.length){
      return { max: Math.round(data.daily.temperature_2m_max[0]), min: Math.round(data.daily.temperature_2m_min[0]), code: data.daily.weathercode[0] };
    }
  }catch(e){ /* offline or out of range */ }
  return null;
}

function linkRow(links){
  if(!links) return "";
  const pairs = [];
  if(links.ig) pairs.push(["IG", links.ig]);
  if(links.other) links.other.forEach(pair=> pairs.push(pair));
  const chips = pairs.map(([label,url])=>{
    if(/instagram\.com/.test(url)) return `<a class="chip chip-ig" href="${url}" target="_blank">📸 Instagram</a>`;
    if(/youtube\.com|youtu\.be/.test(url)) return `<a class="chip chip-yt" href="${url}" target="_blank">▶️ YouTube</a>`;
    if(/threads\.com|threads\.net/.test(url)) return `<a class="chip chip-threads" href="${url}" target="_blank">🧵 Threads</a>`;
    if(/tabelog\.com/.test(url)) return `<a class="chip chip-tabelog" href="${url}" target="_blank">🥢 Tabelog</a>`;
    return `<a class="chip" href="${url}" target="_blank">${label}</a>`;
  });
  return chips.length ? `<div class="linkrow">${chips.join("")}</div>` : "";
}

function itemCard(it, stepNum){
  const typeLabel = {attraction:"景點", food:"餐廳", shop:"購物"}[it.type] || "景點";
  const nav = mapLinksFor(it.name, it.links && it.links.gmap);
  const tags = [];
  if(it.mustEat) tags.push(`<span class="tag mustEat">🍜 必食：${esc(it.mustEat)}</span>`);
  if(it.mustBuy) tags.push(`<span class="tag mustBuy">🛍️ 必買</span>`);
  if(it.top) tags.push(`<span class="tag top">⭐ 極力推薦</span>`);
  return `
  <div class="card">
    <div class="card-top">
      <div class="card-name">${stepNum ? `<span class="stepdot">${stepNum}</span>` : ""}${esc(it.name)}</div>
      <div class="typetag ${it.type}">${typeLabel}</div>
    </div>
    ${it.meta ? `<div class="card-meta">${esc(it.meta)}</div>` : ""}
    ${tags.length ? `<div class="tagrow">${tags.join("")}</div>` : ""}
    ${it.tip ? `<div class="tip-box"><b>💡 導遊貼士：</b>${esc(it.tip)}</div>` : ""}
    <div class="navrow">
      <a class="navbtn google" href="${nav.google}" target="_blank">📍 Google 導航</a>
      <a class="navbtn apple" href="${nav.apple}" target="_blank">🍎 Apple 導航</a>
    </div>
    ${linkRow(it.links)}
  </div>`;
}

const SLOT_ORDER = {"早餐":0, "午餐":1, "晚餐":2, "點心":3};
function sortedFood(list){
  return list.map((f,i)=>({f,i})).sort((a,b)=>{
    const oa = SLOT_ORDER[a.f.slot] ?? 9;
    const ob = SLOT_ORDER[b.f.slot] ?? 9;
    return oa!==ob ? oa-ob : a.i-b.i;
  }).map(x=>x.f);
}
function foodCard(f){
  const nav = mapLinksFor(f.name, f.links && f.links.gmap);
  const tags = [];

  else if(f.star) tags.push(`<span class="tag top">⭐ 高分推薦</span>`);
  return `
  <div class="card">
    <div class="card-top">
      <div class="card-name">${f.slot ? `<span style="color:#a89f88;font-weight:600;">[${f.slot}]</span> ` : ""}${esc(f.name)}</div>
      <div class="typetag food">餐廳</div>
    </div>
    ${f.meta ? `<div class="card-meta">${esc(f.meta)}</div>` : ""}
    ${tags.length ? `<div class="tagrow">${tags.join("")}</div>` : ""}
    ${f.tip ? `<div class="tip-box"><b>💡 導遊貼士：</b>${esc(f.tip)}</div>` : ""}
    ${(f.links && (f.links.gmap||f.links.ig||f.links.other)) ? `

function stopSharing(){
  const statusEl = document.getElementById("share-status");
  const myName = getMyName();
  const key = myName.replace(/[.#$\[\]\/]/g, "_");
  if(statusEl) statusEl.textContent = "處理緊…";
  db.ref("locations/" + key).remove()
    .then(()=>{ if(statusEl) statusEl.textContent = "✅ 已停止分享，團友將不會再見到你嘅位置"; })
    .catch((err)=>{ if(statusEl) statusEl.textContent = "失敗：" + err.message; });
}

function shareMyLocation(){
  const statusEl = document.getElementById("share-status");
  if(!navigator.geolocation){ if(statusEl) statusEl.textContent = "呢個瀏覽器唔支援定位功能"; return; }
  if(statusEl) statusEl.textContent = "定位緊…";
  navigator.geolocation.getCurrentPosition((pos)=>{
    const { latitude, longitude } = pos.coords;
    const myName = getMyName();
    const key = myName.replace(/[.#$\[\]\/]/g, "_");
    db.ref("locations/" + key).set({ name: myName, lat: latitude, lon: longitude, time: Date.now() })
      .then(()=>{ if(statusEl) statusEl.textContent = "✅ 已分享，剛剛更新"; })
      .catch((err)=>{ if(statusEl) statusEl.textContent = "分享失敗：" + err.message; });
  }, (err)=>{
    if(statusEl) statusEl.textContent = "冇法子定位：" + err.message + "（可能要去手機設定開啟定位權限）";
  }, { enableHighAccuracy:true, timeout:12000 });
}

let locationListenerAttached = false;
function attachLocationListener(){
  if(locationListenerAttached) { refreshLocationListUI(); return; }
  locationListenerAttached = true;
  db.ref("locations").on("value", (snap)=>{
    window.__latestLocations = snap.val() || {};
    refreshLocationListUI();
  }, (err)=>{
    const listEl = document.getElementById("loc-list");
    if(listEl) listEl.innerHTML = `<div class="empty-note">讀取失敗：${esc(err.message)}</div>`;
  });
}
function refreshLocationListUI(){
  const listEl = document.getElementById("loc-list");
  if(!listEl) return;
  const val = window.__latestLocations || {};
  const entries = Object.entries(val).sort((a,b)=> b[1].time - a[1].time);
  if(!entries.length){
    listEl.innerHTML = `<div class="empty-note">仲未有人分享位置</div>`;
    return;
  }
  listEl.innerHTML = entries.map(([key,p])=>{
    const mins = Math.round((Date.now() - p.time) / 60000);
    const agoText = mins < 1 ? "啱啱" : mins < 60 ? `${mins}分鐘前` : `${Math.round(mins/60)}小時前`;
    return `<div class="bigcard">
      <div class="name">${esc(p.name)}</div>
      <div class="detail">最後更新：${agoText}</div>
      <div class="navrow" style="margin-top:8px;">
        <a class="navbtn google" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}" target="_blank">📍 Google 導航</a>
        <a class="navbtn apple" href="https://maps.apple.com/?ll=${p.lat},${p.lon}" target="_blank">🍎 Apple 導航</a>
      </div>
      <button class="loc-stop-btn" data-key="${key}" style="margin-top:8px;width:100%;justify-content:center;display:flex;align-items:center;gap:6px;background:var(--rust);color:#fff;border:none;border-radius:9px;padding:8px 0;font-size:11.5px;font-weight:700;">🛑 停止分享呢個位置</button>
    </div>`;
  }).join("");
  listEl.querySelectorAll(".loc-stop-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!confirm("確定要停止分享呢個位置？")) return;
      db.ref("locations/" + btn.dataset.key).remove();
    });
  });
}

  const totalJPY = expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const dayOptions = DAYS.map(d=>`<option value="${d.day}">Day ${d.day}（${d.dateLabel}）</option>`).join("");
  const cachedFx = loadCachedRate();
  const fxRate = (cachedFx && cachedFx.rate) || (1/19);
  const sharing = isBudgetSharing();

  let html = `
  <div class="budget-summary">
    <div class="lbl">總支出（日圓）</div>
    <div class="amt">¥${totalJPY.toLocaleString()}</div>
    <div class="lbl" id="fx-note" style="margin-top:4px;">約 HKD $${jpyToHkd(totalJPY, fxRate).toLocaleString()}</div>
    <div class="lbl" id="fx-rate-line" style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.2);">💱 今日匯率：1 HKD ≈ ${(1/fxRate).toFixed(2)} JPY${cachedFx ? "" : "（預設值，連網後自動更新）"}</div>
  </div>
  <div class="budget-form">
    <div class="row">
      <select id="bg-day">${dayOptions}</select>
      <select id="bg-cat">
        <option>🍴 餐飲</option><option>🚗 交通</option><option>🏨 住宿</option>
        <option>🎟️ 門票</option><option>🛍️ 購物</option><option>其他</option>
      </select>
    </div>
    <div class="row">
      <input id="bg-note" type="text" placeholder="備註（例如：晚餐）">
      <input id="bg-amt" type="number" placeholder="金額 ¥" inputmode="numeric">
    </div>
    <button id="bg-add">＋ 記一筆</button>
  </div>
  <div class="bigcard" style="padding:12px 14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <div>
        <div class="name" style="font-size:12.5px;">🔗 同屋企人分享我嘅記帳</div>
        <div class="detail" style="margin-top:2px;">開啟後，屋企人打開呢個App嘅「記帳」都會見到你嘅支出總額</div>
      </div>
      <label class="switch"><input type="checkbox" id="bg-share-toggle" ${sharing?"checked":""}><span class="slider"></span></label>
    </div>
  </div>
  <div id="family-budget-block"></div>
  <div class="sectitle" style="margin-top:18px;">支出記錄</div>
  <div id="expense-list"></div>
  `;
  content.innerHTML = html;

  const listEl = document.getElementById("expense-list");
  if(!expenses.length){
    listEl.innerHTML = `<div class="empty-note">仲未有記錄，記低第一筆支出啦 ✏️</div>`;
  } else {
    listEl.innerHTML = expenses.slice().reverse().map((e,revIdx)=>{
      const idx = expenses.length - 1 - revIdx;
      return `<div class="expense-item">
        <div class="left"><div class="cat">${e.cat} · Day ${e.day}</div><div class="note">${esc(e.note)||"—"}</div></div>
        <div class="right"><div class="amt">¥${Number(e.amount).toLocaleString()}</div><button class="delbtn" data-idx="${idx}">✕</button></div>
      </div>`;
    }).join("");
    listEl.querySelectorAll(".delbtn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const list = loadExpenses();
        list.splice(parseInt(btn.dataset.idx),1);
        saveExpenses(list);
        syncSharedBudget();
        renderBudget();
      });
    });
  }

  document.getElementById("bg-add").addEventListener("click", ()=>{
    const day = document.getElementById("bg-day").value;
    const cat = document.getElementById("bg-cat").value;
    const note = document.getElementById("bg-note").value;
    const amount = document.getElementById("bg-amt").value;
    if(!amount || isNaN(amount) || Number(amount)<=0){ alert("請輸入正確金額"); return; }
    const list = loadExpenses();
    list.push({day, cat, note, amount});
    saveExpenses(list);
    syncSharedBudget();
    renderBudget();
  });

  document.getElementById("bg-share-toggle").addEventListener("change", (ev)=>{
    if(ev.target.checked){
      if(!db){ alert("暫時未連接到分享服務，請檢查網絡"); ev.target.checked = false; return; }
      let myName = getMyName();
      if(!myName){
        myName = (window.prompt("請輸入你嘅名，畀屋企人知道係邊個嘅支出：") || "").trim();
        if(!myName){ ev.target.checked = false; return; }
        setMyName(myName);
      }
      setBudgetSharing(true);
    } else {
      setBudgetSharing(false);
    }
    syncSharedBudget();
    renderBudget();
  });

  renderFamilyBudget(fxRate);

  if(!cachedFx || (Date.now() - cachedFx.ts > 6*60*60*1000)){
    fetchLiveRate().then(rate=>{
      if(!rate) return;
      const note = document.getElementById("fx-note");
      if(note) note.textContent = `約 HKD $${jpyToHkd(totalJPY, rate).toLocaleString()}`;
      const rateLine = document.getElementById("fx-rate-line");
      if(rateLine) rateLine.textContent = `💱 今日匯率：1 HKD ≈ ${(1/rate).toFixed(2)} JPY`;
    });
  }
}

/* ================= TAB SWITCH ================= */
let currentTab = "itinerary";
function renderAll(){
  renderDayChips();
  document.getElementById("daychips").classList.toggle("hide", currentTab!=="itinerary");
  if(currentTab==="itinerary") renderItinerary();
  else if(currentTab==="info") renderInfo();
  else if(currentTab==="pocket") renderPocket();
  else if(currentTab==="location") renderLocation();
  else if(currentTab==="budget") renderBudget();
}
document.querySelectorAll(".navitem").forEach(item=>{
  item.addEventListener("click", ()=>{
    document.querySelectorAll(".navitem").forEach(i=>i.classList.remove("active"));
    item.classList.add("active");
    currentTab = item.dataset.tab;
    window.scrollTo(0, 0);
    renderAll();
  });
});

renderAll();

/* ================= ADD TO HOME SCREEN ================= */
const INSTALL_DISMISS_KEY = "waittravel2026_install_dismissed";
let deferredInstallPrompt = null;

function isStandaloneMode(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function showInstallBanner(kind){
  if(localStorage.getItem(INSTALL_DISMISS_KEY)) return;
  if(isStandaloneMode()) return;
  const slot = document.getElementById("install-banner-slot");
  if(!slot || slot.children.length) return;
  let inner = "";
  if(kind === "android"){
    inner = `<div class="txt">📲 一鍵加到主畫面，用返好似App咁方便</div><button class="installbtn" id="do-install">安裝</button><button class="closebtn" id="close-install">✕</button>`;
  } else if(kind === "ios"){
    inner = `<div class="txt">📲 想要Icon喺主畫面？撳底部 <b>分享</b> 圖示（正方形箭嘴向上）→ 揀「加入主畫面」</div><button class="closebtn" id="close-install">✕</button>`;
  } else {
    inner = `<div class="txt">📲 想要Icon喺主畫面？打開瀏覽器選單 → 揀「加到主畫面」</div><button class="closebtn" id="close-install">✕</button>`;
  }
  const div = document.createElement("div");
  div.className = "installbanner";
  div.innerHTML = inner;
  slot.appendChild(div);
  const closeBtn = document.getElementById("close-install");
  if(closeBtn) closeBtn.addEventListener("click", ()=>{
    localStorage.setItem(INSTALL_DISMISS_KEY, "1");
    slot.innerHTML = "";
  });
  const doBtn = document.getElementById("do-install");
  if(doBtn) doBtn.addEventListener("click", async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    localStorage.setItem(INSTALL_DISMISS_KEY, "1");
    slot.innerHTML = "";
  });
}

window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner("android");
});

(function initInstallBannerFallback(){
  const ua = navigator.userAgent || "";
  const isIOS = /iphone|ipad|ipod/i.test(ua);
  if(isIOS){
    showInstallBanner("ios");
  } else {
    // give Android/Chrome a moment to fire beforeinstallprompt; otherwise show generic hint
    setTimeout(()=>{ if(!deferredInstallPrompt) showInstallBanner("generic"); }, 2500);
  }
})();
</script>
